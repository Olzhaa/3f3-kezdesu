  --ok:#15803d; --warn:#b45309; --bad:#dc2626;
  --c1:#f97316; --c2:#4f46e5; --c3:#0d9488; --c4:#db2777;
  --shadow:0 2px 0 rgba(79,70,229,.10),0 10px 28px -6px rgba(30,27,75,.16);

}

/* ---------- API (Google Apps Script) ---------- */
const TOKEN_KEY="3f3-token";
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||""}catch{return ""}}
function setToken(t){try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch{}}
async function api(action,data={}){
  if(!window.API_URL)throw new Error("no_api");
  const r=await fetch(window.API_URL,{method:"POST",body:JSON.stringify({action,...data})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j;
}
function applyStudent(j){S.me=j.me;S.uid=j.me.id;S.myNote=j.note||null;S.slots=j.slots||{};if(j.config)S.config={...S.config,...j.config}}
function applyAdmin(j){S.students=j.students||{};S.notes=j.notes||{};S.slots=j.slots||{};if(j.config)S.config={...S.config,...j.config}}
let pollT;

async function refreshAdmin(){const j=await api("admin",{pw:S.pw});applyAdmin(j);rerender()}

  if(location.hash==="#teacher"){teacherLogin();return}
  const t=getToken();

  try{const j=await api("me",{token:t});applyStudent(j);renderStudent();startPoll(refreshStudent,30000)}

}

    <div class="banner">Төмендегінің бәрін тек осы студент көреді.</div>
    <label for="n-notes">Кездесудегі жазба<textarea id="n-notes" rows="5" placeholder="Не айтты, не байқадыңыз, келісімдер">${esc(n.notes||"")}</textarea></label>
    <label for="n-plan">Келесі қадамдар (жақын 2–4 апта)<textarea id="n-plan" rows="4" placeholder="1. Практика орнымен келісімшартқа қол қою — 1 қарашаға дейін">${esc(n.plan||"")}</textarea></label>
    <div class="row" style="justify-content:space-between"><h2>Жеке даму жоспары (IDP), 1 жыл</h2><div class="row"><button type="button" id="gen" ${S.sample?"":"hidden"}>Жауаптардан IDP жобасын жасау</button><span class="saved" id="gen-msg"></span></div></div>
    <label for="d-goal">Бір жылдық басты мақсат<input id="d-goal" value="${esc(p.goal)}" placeholder="Қазан 2027-ге дейін ... саласында алғашқы ақылы жұмысқа шығу"></label>
    <label for="d-direction">Кәсіби бағыт<input id="d-direction" value="${esc(p.direction)}"></label>
    <h3 class="idp-h">1. Тұлға психотипі</h3>
    <div class="grid2"><label for="d-gallup">Gallup: ТОП-5 талант<textarea id="d-gallup">${esc(p.gallup)}</textarea></label>
    <label for="d-gallupWeak">Gallup: әлсіз таланттар және не істеу керек<textarea id="d-gallupWeak">${esc(p.gallupWeak)}</textarea></label>
    <label for="d-mbti">MBTI: тип, күшті және әлсіз жақтар, оқу стилі<textarea id="d-mbti">${esc(p.mbti)}</textarea></label>
    <label for="d-gardner">Гарднер: басым интеллект түрлері<textarea id="d-gardner">${esc(p.gardner)}</textarea></label></div>
    <h3 class="idp-h">2. Даму жоспары</h3>
    <div class="goalgrid"><span class="eyebrow">Даму мақсаты</span><span class="eyebrow">Күтілетін нәтиже</span><span class="eyebrow">Мерзімі</span><span class="eyebrow">Табыстылық көрсеткіші</span>
    ${goals.map((g,i)=>`<input id="g${i}-goal" aria-label="Мақсат ${i+1}" value="${esc(g.goal)}" placeholder="Мақсат ${i+1}"><input id="g${i}-result" aria-label="Нәтиже ${i+1}" value="${esc(g.result)}"><input id="g${i}-deadline" aria-label="Мерзім ${i+1}" value="${esc(g.deadline)}" placeholder="мыс. Наурыз 2027"><input id="g${i}-kpi" aria-label="Көрсеткіш ${i+1}" value="${esc(g.kpi)}">`).join("")}</div>
    <label for="d-selfdev">Өзін-өзі дамыту (әдеттер, оқу, тақырыптар)<textarea id="d-selfdev">${esc(p.selfdev)}</textarea></label>
    ${QUARTERS.map((qt,i)=>{const q=(p.quarters||[])[i]||{};return`<div class="q-quarter"><span class="eyebrow">${qt}</span>
      <label for="q${i}-focus">Мақсат<input id="q${i}-focus" value="${esc(q.focus)}" placeholder="${esc(QHINT[i])}"></label>
      <label for="q${i}-actions">Негізгі іс-шаралар<textarea id="q${i}-actions">${esc(q.actions)}</textarea></label>
      <label for="q${i}-result">Нәтиже<input id="q${i}-result" value="${esc(q.result)}"></label></div>`}).join("")}
    <h3 class="idp-h">3. Ұсыныстар</h3>
    <label for="d-talents">Таланттар мен қабілеттерді дамыту<textarea id="d-talents">${esc(p.talents)}</textarea></label>
    <div class="grid2"><label for="d-professions">Кәсіби бағыттар<textarea id="d-professions">${esc(p.professions)}</textarea></label>
    <label for="d-books">Кітаптар мен фильмдер<textarea id="d-books">${esc(p.books)}</textarea></label></div>
    <h3 class="idp-h">4. Трекинг</h3>
    <label for="d-tracking" class="sr">Трекинг<textarea id="d-tracking">${esc(p.tracking)}</textarea></label>
    <div class="row savebar"><button class="primary" type="submit">Сақтау және студентке көрсету</button><span class="saved" id="s-msg"></span></div>
  </form>`;
  renderStudentHead();
  $("#s-form").addEventListener("submit",async e=>{e.preventDefault();
    try{const note={notes:$("#n-notes").value,plan:$("#n-plan").value,idp:readIdp(),updatedAt:new Date().toISOString()};await api("saveNote",{pw:S.pw,id,note});S.notes[id]=note;flash($("#s-msg"),"Сақталды. Студент өз бетінде көреді.")}catch{flash($("#s-msg"),"Сақталмады, қайта басыңыз.")}});
  const g=$("#gen");if(g)g.onclick=()=>generate(id);
}
const IDF=["goal","direction","gallup","gallupWeak","mbti","gardner","selfdev","talents","professions","books","tracking"];
function readIdp(){const o={};IDF.forEach(k=>o[k]=$("#d-"+k).value);
  o.goals=[0,1,2,3].map(i=>({goal:$(`#g${i}-goal`).value,result:$(`#g${i}-result`).value,deadline:$(`#g${i}-deadline`).value,kpi:$(`#g${i}-kpi`).value}));
  o.quarters=QUARTERS.map((_,i)=>({period:QUARTERS[i],focus:$(`#q${i}-focus`).value,actions:$(`#q${i}-actions`).value,result:$(`#q${i}-result`).value}));return o}
function fillIdp(p){const set=(s,v)=>{if(v!=null&&v!==""&&$(s))$(s).value=Array.isArray(v)?v.join("\n"):v};
  IDF.forEach(k=>set("#d-"+k,p[k]));
  (p.goals||[]).slice(0,4).forEach((g,i)=>{set(`#g${i}-goal`,g.goal);set(`#g${i}-result`,g.result);set(`#g${i}-deadline`,g.deadline);set(`#g${i}-kpi`,g.kpi)});
  (p.quarters||[]).slice(0,4).forEach((q,i)=>{set(`#q${i}-focus`,q.focus);set(`#q${i}-actions`,q.actions);set(`#q${i}-result`,q.result)})}
async function generate(id){
  const btn=$("#gen"),msg=$("#gen-msg");const st=S.students[id]||{};btn.disabled=true;msg.textContent="Жоба жазылып жатыр…";
  const qa=SECTIONS.map(sec=>`## ${sec.t}\n`+QUESTIONS.filter(q=>q.s===sec.id).map(q=>`${q.t}\n${(st.answers||{})[q.k]||"(жауап жоқ)"}`).join("\n")).join("\n\n");
  const ik=IKI.map(i=>`${i.t} ${(st.ikigai||{})[i.k]||"-"}`).join("\n")+`\nИкигай: ${(st.ikigai||{}).center||"-"}`;
  const prompt=`Сен колледж кураторына көмектесесің. 3F3 тобының студентіне 1 жылдық жеке даму жоспарын (IDP) қазақ тілінде жаз. Кезең: Қараша 2026 – Қазан 2027. 2-семестрде (Ақпан–Сәуір 2027) студент өндірістік практикаға барады.
Құрылым: 1) Тұлға психотипі (Gallup, MBTI, Гарднер нәтижелерін түсіндіру), 2) Даму жоспары (мақсат / күтілетін нәтиже / мерзім / табыстылық көрсеткіші кестесі, өзін-өзі дамыту, 4 кезең), 3) Ұсыныстар (таланттарды дамыту, кәсіби бағыттар, кітаптар мен фильмдер), 4) Трекинг.
Нақты, өлшенетін, студенттің жауаптарына сүйенген жоспар жаз. Тест нәтижесі жоқ болса, сол өрісті бос қалдыр немесе "тестті тапсыру" деп жаз. Ойдан шығарма.

Студенттің жауаптары:
${qa}

Икигай:
${ik}

Мұғалімнің кездесудегі жазбасы:
${$("#n-notes").value||"(жоқ)"}

Тек JSON қайтар, барлық мәндер жол (string), тізімді жаңа жолмен бөл:
{"goal":"бір сөйлем","direction":"кәсіби бағыт","gallup":"ТОП-5 талант және қысқа түсіндірме","gallupWeak":"әлсіз таланттар және не істеу керек","mbti":"тип, күшті/әлсіз жақтар, оқу стилі","gardner":"басым интеллект түрлері және мағынасы","goals":[{"goal":"","result":"","deadline":"","kpi":""}, ... 4 мақсат],"selfdev":"5-7 нақты әдет/тапсырма","quarters":[{"focus":"","actions":"","result":""}, ... 4 кезең: ${QUARTERS.join("; ")}],"talents":"","professions":"5-8 нақты мамандық","books":"4-6 кітап/фильм","tracking":"бақылау тәртібі"}`;
  try{const r=await S.sample.json(prompt,{modelTier:"default"});fillIdp(r||{});msg.textContent="Жоба дайын. Тексеріп, түзетіп, Сақтау басыңыз."}
  catch(e){msg.textContent=e.code==="not_granted"?"Claude-ға рұқсат берілмеді. Жоспарды қолмен толтырыңыз.":e.code==="rate_limited"?"Сұрау көп болды, біраздан кейін қайталаңыз.":"Жоба жасалмады. Қолмен толтырыңыз немесе қайта көріңіз."}
  finally{btn.disabled=false}
}
boot();
</script>

</body>
</html>
